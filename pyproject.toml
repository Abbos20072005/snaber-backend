[project]
name = "b2bmarket-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.1.2",
    "dj-rest-auth>=7.2.0",
    "django>=6.0.3",
    "django-allauth>=65.18.0",
    "django-ckeditor>=6.7.3",
    "django-cors-headers>=4.9.0",
    "django-countries>=8.2.0",
    "django-filter>=25.2",
    "django-modeltranslation>=0.20.2",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-yasg>=1.21.15",
    "openpyxl>=3.1.5",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "requests>=2.34.2",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.8",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
  "**/migrations/**",
  "**/__pycache__/**",
  "**/apps.py",
  "**/asgi.py",
  "**/wsgi.py",
  "**/manage.py",
  "**/settings.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "C4", "T20"]

[tool.ruff.lint.per-file-ignores]
"apps/admin_panel/admin.py" = ["E501"]
"apps/**/models/*.py" = ["DJ001", "E501"]
"**/__init__.py" = ["F401", "F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
